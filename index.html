<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DriveLog</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E1E1E">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-color: #121212;
      --surface-color: #1E1E1E;
      --card-color: #F4F1E1; 
      --accent-color: #F0713B; 
      --text-main: #FFFFFF;
      --text-muted: #888888;
      --text-card: #121212;
      --border-radius-pill: 50px;
      --border-radius-card: 24px;
    }

    [data-theme="light"] {
      --bg-color: #F8F9FA;
      --surface-color: #FFFFFF;
      --card-color: #FFFFFF;
      --text-main: #121212;
      --text-muted: #666666;
      --text-card: #121212;
    }

    html { overscroll-behavior-y: none; background-color: var(--bg-color); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

    /* 입력 가능한 요소는 텍스트 선택/길게 누르기 정상 동작하도록 예외 처리 */
    input, textarea {
      -webkit-touch-callout: default;
      -webkit-user-select: text;
      user-select: text;
    }
    
    body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s, color 0.3s; overscroll-behavior-y: none; }

    #app { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; position: relative; }

    /* 글로벌 헤더 */
    .global-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 10px 20px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; }
    .brand-logo { height: 44px; width: auto; object-fit: contain; }
    
    .gps-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; background: var(--surface-color); padding: 6px 12px; border-radius: var(--border-radius-pill); }
    .gps-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
    .gps-dot.green { background: #4CAF50; box-shadow: 0 0 8px #4CAF50; }
    .gps-dot.yellow { background: #FFEB3B; box-shadow: 0 0 8px #FFEB3B; }
    .gps-dot.red { background: #F44336; box-shadow: 0 0 8px #F44336; }

    /* 탭 컨텐츠 */
    .tab-content { flex: 1; overflow-y: auto; overscroll-behavior-y: contain; padding: 10px 20px calc(96px + env(safe-area-inset-bottom)) 20px; display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* 메인 화면 */
    .header-area { margin-bottom: 40px; margin-top: 10px; }
    .distance-display h1 { font-size: 3.2rem; font-weight: 800; color: var(--accent-color); line-height: 1.1; letter-spacing: -1px;}
    .distance-display p { font-size: 1rem; color: var(--text-muted); margin-bottom: 8px; }
    .main-btn-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 20px; }
    .main-toggle-btn { width: 220px; height: 220px; border-radius: 50%; border: none; background: var(--surface-color); color: var(--text-main); font-size: 2.2rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 10px 10px 20px rgba(0,0,0,0.2), -10px -10px 20px rgba(255,255,255,0.05); transition: all 0.2s ease; cursor: pointer; }
    .main-toggle-btn:active { transform: scale(0.95); box-shadow: inset 10px 10px 20px rgba(0,0,0,0.2), inset -10px -10px 20px rgba(255,255,255,0.05); }
    .main-toggle-btn.is-running { background: var(--accent-color); color: white; box-shadow: 0 0 30px rgba(240, 113, 59, 0.4); }
    .current-location { text-align: center; margin-top: 35px; font-size: 0.95rem; color: var(--text-muted); min-height: 40px; padding: 0 20px; line-height: 1.5; }

    /* 타임라인 카드 (압축형) */
    .history-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .history-month-header { font-size: 1.2rem; font-weight: bold; }
    .add-record-btn { background: var(--accent-color); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .add-record-btn i { width: 18px; height: 18px; }
    .view-toggle-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .view-toggle-btn { flex: 1; padding: 8px; border: none; border-radius: 10px; background: var(--surface-color); color: var(--text-muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .view-toggle-btn.active { background: var(--accent-color); color: white; }
    .card-date { font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; cursor: pointer; }
    .card-date-right { display: flex; align-items: center; gap: 6px; }
    .card-date-total { font-weight: 800; color: var(--accent-color); font-size: 0.95rem; }
    .card-date .date-chevron { transition: transform 0.25s ease; width: 16px; height: 16px; color: var(--text-muted); }
    .card-date.collapsed .date-chevron { transform: rotate(-90deg); }
    .date-group-body { overflow: hidden; }
    .summary-card { background: var(--card-color); color: var(--text-card); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .summary-route { font-size: 0.85rem; font-weight: 600; flex: 1; line-height: 1.4; }
    .summary-distance { font-size: 0.95rem; font-weight: bold; color: var(--accent-color); white-space: nowrap; flex-shrink: 0; }
    .swipe-wrapper { position: relative; border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
    .swipe-delete-bg { position: absolute; top: 0; right: 0; bottom: 0; width: 64px; background: #F44336; display: flex; align-items: center; justify-content: center; color: white; }
    .timeline-card { background: var(--card-color); color: var(--text-card); border-top-left-radius: 14px; border-bottom-left-radius: 14px; border-top-right-radius: 0; border-bottom-right-radius: 0; padding: 10px 14px; position: relative; margin-bottom: 0; touch-action: pan-y; transition: transform 0.25s ease; will-change: transform; }
    .card-row-top { display: flex; justify-content: space-between; align-items: center; }
    .card-time { font-size: 0.75rem; color: #777; }
    .card-distance { font-size: 1rem; font-weight: bold; color: var(--accent-color); }
    .card-addr-row { font-size: 0.76rem; color: #444; margin-top: 3px; line-height: 1.4; }
    .card-addr-label { display: inline-block; width: 34px; font-weight: 700; color: var(--accent-color); font-size: 0.68rem; vertical-align: top; }
    .card-note-badge { font-size: 0.7rem; color: var(--accent-color); margin-top: 2px; }

    /* 설정 영역 */
    .settings-group { background: var(--surface-color); border-radius: var(--border-radius-card); padding: 10px 20px; margin-bottom: 20px; }
    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .setting-item:last-child { border-bottom: none; }
    .setting-label { display: flex; align-items: center; gap: 12px; }
    .setting-action { background: var(--accent-color); color: white; border: none; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .setting-action i { width: 19px; height: 19px; }
    .advanced-toggle { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
    .advanced-toggle .adv-chevron { transition: transform 0.25s ease; width: 16px; height: 16px; }
    .advanced-toggle.open .adv-chevron { transform: rotate(180deg); }
    .setting-danger { background: #F44336; }
    
    /* 토글 스위치 */
    .toggle-switch { position: relative; width: 50px; height: 28px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(22px); }

    /* 하단 네비게이션 바 */
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; height: calc(76px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface-color); display: flex; justify-content: space-around; align-items: center; border-top-left-radius: 24px; border-top-right-radius: 24px; box-shadow: 0 -10px 30px rgba(0,0,0,0.18); border-top: 1px solid rgba(128,128,128,0.12); z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); padding: 9px 22px; border-radius: 18px; cursor: pointer; transition: background-color 0.25s ease, color 0.25s ease, transform 0.15s ease; position: relative; }
    .nav-item:active { transform: scale(0.92); }
    .nav-item i { width: 22px; height: 22px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .nav-item span { font-size: 0.7rem; font-weight: 600; opacity: 0.7; transition: opacity 0.25s ease; }
    .nav-item.active { background: rgba(240, 113, 59, 0.12); color: var(--accent-color); }
    .nav-item.active i { transform: translateY(-1px) scale(1.1); }
    .nav-item.active span { opacity: 1; }

    /* 로딩 오버레이 */
    .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; color: white;}
    .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid var(--accent-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px;}
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 수정 모달 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: var(--surface-color); color: var(--text-main); border-radius: var(--border-radius-card); padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .modal-field { margin-bottom: 16px; }
    .modal-field label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .modal-field input, .modal-field textarea { width: 100%; background: var(--bg-color); color: var(--text-main); border: 1px solid #444; border-radius: 8px; padding: 10px; font-size: 1rem; resize: none; font-family: inherit; }
    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
    .modal-btn { flex: 1; padding: 12px; border: none; border-radius: var(--border-radius-pill); font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    .modal-btn-cancel { background: #444; color: white; }
    .modal-btn-save { background: var(--accent-color); color: white; }

  </style>
</head>
<body>

<div id="app">
  <header class="global-header">
    <div class="brand">
      <img id="header-logo-img" src="header_logo.png" alt="DriveLog Logo" class="brand-logo" onerror="this.style.display='none'">
    </div>
    <div class="gps-indicator">
      <div id="gps-dot" class="gps-dot red"></div>
      <span id="gps-text">GPS 확인중</span>
    </div>
  </header>

  <div id="tab-main" class="tab-content active">
    <div class="header-area">
      <div class="distance-display">
        <p>오늘 누적 이동 거리</p>
        <h1><span id="today-distance">0.0</span> <span style="font-size: 1.2rem;">km</span></h1>
        <p style="margin-top:8px; font-size:1.05rem;">이번 달 누계: <span id="month-distance" style="font-size:1.3rem; font-weight:700; color:var(--text-main);">0.0</span> km</p>
      </div>
    </div>
    <div class="main-btn-container">
      <button id="btn-toggle-drive" class="main-toggle-btn" onclick="toggleDrive()">
        <i data-lucide="play" id="btn-icon" style="width:56px; height:56px;"></i>
        <span id="btn-text">출발</span>
      </button>
      <div class="current-location">
        <i data-lucide="map-pin" style="width:16px; height:16px; display:inline-block; vertical-align:middle; margin-right:4px;"></i>
        <span id="location-text">위치 정보를 파악하고 있습니다...</span>
      </div>
    </div>
  </div>

  <div id="tab-history" class="tab-content">
    <div class="history-header-row">
      <div class="history-month-header" id="history-month-title">전체 내역</div>
      <button class="add-record-btn" onclick="openAddModal()"><i data-lucide="plus"></i></button>
    </div>
    <div class="view-toggle-row">
      <button class="view-toggle-btn active" id="btn-view-detail" onclick="setHistoryViewMode('detail')">상세보기</button>
      <button class="view-toggle-btn" id="btn-view-summary" onclick="setHistoryViewMode('summary')">일지용 요약</button>
    </div>
    <div id="history-list"></div>
  </div>

  <div id="tab-settings" class="tab-content">
    <h2 style="margin-bottom: 20px;">설정 및 관리</h2>

    <div class="settings-group">
      <div class="setting-item">
        <div class="setting-label"><i data-lucide="refresh-cw"></i> 앱 새로고침</div>
        <button class="setting-action" onclick="forceRefreshApp()"><i data-lucide="refresh-cw"></i></button>
      </div>
    </div>

    <div class="settings-group">
      <div class="setting-item">
        <div class="setting-label"><i data-lucide="moon"></i> 다크 모드</div>
        <label class="toggle-switch">
          <input type="checkbox" id="setting-darkmode" checked onchange="toggleDarkMode()">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <div class="setting-label"><i data-lucide="smartphone"></i> 햅틱(진동)</div>
        <label class="toggle-switch">
          <input type="checkbox" id="setting-haptic" checked onchange="saveSettings()">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <div class="setting-label">
          <div><i data-lucide="map"></i> 주소 표기</div>
        </div>
        <select id="setting-address" onchange="saveSettings()" style="background:var(--bg-color); color:var(--text-main); border:1px solid #444; padding:5px; border-radius:8px;">
          <option value="jibun">지번 우선</option>
          <option value="road">도로명 우선</option>
        </select>
      </div>
      <div class="setting-item">
        <div class="setting-label"><i data-lucide="gauge"></i> 계기판 오차 (+%)</div>
        <input type="number" id="setting-offset" value="3" onchange="saveSettings()" style="width:60px; text-align:right; background:var(--bg-color); color:var(--text-main); border:1px solid #444; padding:5px; border-radius:8px;">
      </div>
    </div>

    <div class="settings-group">
      <div class="setting-item">
        <div class="setting-label"><i data-lucide="file-spreadsheet"></i> 엑셀(CSV) 다운로드</div>
        <button class="setting-action" onclick="downloadCSV()"><i data-lucide="download"></i></button>
      </div>
      <div style="font-size:0.7rem; color:var(--text-muted); margin: -8px 4px 8px 4px;">현재 <span id="csv-mode-label">상세</span> 보기 기준으로 내보내집니다 (내역 탭에서 전환 가능)</div>
      <div class="setting-item">
        <div class="setting-label"><i data-lucide="download-cloud"></i> 데이터 백업 (JSON)</div>
        <button class="setting-action" onclick="exportBackup()"><i data-lucide="save"></i></button>
      </div>
      <div class="setting-item">
        <div class="setting-label"><i data-lucide="upload-cloud"></i> 데이터 복원</div>
        <button class="setting-action" onclick="document.getElementById('restore-file-input').click()"><i data-lucide="upload"></i></button>
        <input type="file" id="restore-file-input" accept="application/json" style="display:none;" onchange="handleRestoreFile(event)">
      </div>
      <div class="setting-item">
        <div class="setting-label"><i data-lucide="calendar-x"></i> 이전 기록 삭제</div>
        <button class="setting-action" onclick="deletePastMonths()"><i data-lucide="calendar-x"></i></button>
      </div>
      <div style="font-size:0.7rem; color:var(--text-muted); margin: -8px 4px 8px 4px;">이번 달을 제외한 지난 기록을 삭제합니다</div>
    </div>

    <div class="settings-group">
      <div class="advanced-toggle" id="advanced-toggle" onclick="toggleAdvancedSettings()">
        <span>고급 설정</span>
        <i data-lucide="chevron-down" class="adv-chevron"></i>
      </div>
      <div id="advanced-settings-body" style="display:none;">
        <div class="setting-item">
          <div class="setting-label" style="color:#F44336;"><i data-lucide="trash-2"></i> 데이터 초기화</div>
          <button class="setting-action setting-danger" onclick="resetData()"><i data-lucide="trash-2"></i></button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-bar">
    <div class="nav-item active" onclick="switchTab('main')" id="nav-main"><i data-lucide="car"></i><span>운행</span></div>
    <div class="nav-item" onclick="switchTab('history')" id="nav-history"><i data-lucide="list"></i><span>내역</span></div>
    <div class="nav-item" onclick="switchTab('settings')" id="nav-settings"><i data-lucide="settings"></i><span>설정</span></div>
  </nav>

  <div class="loading-overlay" id="loading-overlay"><div class="spinner"></div><p id="loading-text">처리중...</p></div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
      <h3 style="margin-bottom:20px;">운행 기록 수정</h3>
      <div class="modal-field">
        <label>주행거리 (km)</label>
        <input type="number" id="edit-distance" step="0.1" inputmode="decimal">
      </div>
      <div class="modal-field">
        <label>비고 / 메모</label>
        <textarea id="edit-note" rows="3" placeholder="방문지나 목적을 입력하세요"></textarea>
      </div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="closeEditModal()">취소</button>
        <button class="modal-btn modal-btn-save" onclick="saveEditModal()">저장</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="add-modal">
    <div class="modal-card">
      <h3 style="margin-bottom:20px;">운행 기록 수동 추가</h3>
      <div class="modal-field">
        <label>날짜</label>
        <input type="date" id="add-date">
      </div>
      <div class="modal-field">
        <label>출발 시간</label>
        <input type="time" id="add-start-time">
      </div>
      <div class="modal-field">
        <label>도착 시간</label>
        <input type="time" id="add-end-time">
      </div>
      <div class="modal-field">
        <label>출발지</label>
        <input type="text" id="add-start-addr" placeholder="예: 강원특별자치도 원주시 ...">
      </div>
      <div class="modal-field">
        <label>도착지</label>
        <input type="text" id="add-end-addr" placeholder="예: 강원특별자치도 강릉시 ...">
      </div>
      <div class="modal-field">
        <label>주행거리 (km)</label>
        <input type="number" id="add-distance" step="0.1" inputmode="decimal">
      </div>
      <div class="modal-field">
        <label>비고 / 메모 (선택)</label>
        <textarea id="add-note" rows="2" placeholder="선택 입력"></textarea>
      </div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="closeAddModal()">취소</button>
        <button class="modal-btn modal-btn-save" onclick="saveAddModal()">추가</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="alert-modal">
    <div class="modal-card">
      <p id="alert-message" style="margin-bottom:20px; line-height:1.5; white-space:pre-line;"></p>
      <div class="modal-actions" id="alert-actions"></div>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  // 길게 누르기 시 나오는 브라우저 기본 메뉴(웹 검색/공유 등) 차단 — 입력 요소는 예외
  document.addEventListener('contextmenu', e => {
    if (!['INPUT', 'TEXTAREA'].includes(e.target.tagName)) e.preventDefault();
  });

  // ★ 생성한 Cloudflare 프록시 주소 (반드시 https:// 로 시작해야 합니다)
  const PROXY_URL = "https://drivelog-proxy.jhkang7989.workers.dev";

  let appState = {
    isRunning: false,
    currentTrip: null,
    records: [],
    settings: { darkMode: true, haptic: true, addressPref: 'jibun', offsetPercent: 3 }
  };

  function showAlert(message) {
    return new Promise(resolve => {
      document.getElementById('alert-message').innerText = message;
      const actions = document.getElementById('alert-actions');
      actions.innerHTML = `<button class="modal-btn modal-btn-save" id="alert-ok-btn">확인</button>`;
      document.getElementById('alert-modal').classList.add('active');
      document.getElementById('alert-ok-btn').onclick = () => {
        document.getElementById('alert-modal').classList.remove('active');
        resolve();
      };
    });
  }

  function showConfirm(message) {
    return new Promise(resolve => {
      document.getElementById('alert-message').innerText = message;
      const actions = document.getElementById('alert-actions');
      actions.innerHTML = `
        <button class="modal-btn modal-btn-cancel" id="confirm-cancel-btn">취소</button>
        <button class="modal-btn modal-btn-save" id="confirm-ok-btn">확인</button>
      `;
      document.getElementById('alert-modal').classList.add('active');
      document.getElementById('confirm-cancel-btn').onclick = () => {
        document.getElementById('alert-modal').classList.remove('active');
        resolve(false);
      };
      document.getElementById('confirm-ok-btn').onclick = () => {
        document.getElementById('alert-modal').classList.remove('active');
        resolve(true);
      };
    });
  }

  function loadData() {
    const data = localStorage.getItem('driveRecords_v4');
    if (data) appState = JSON.parse(data);
    
    document.getElementById('setting-darkmode').checked = appState.settings.darkMode !== false;
    document.getElementById('setting-haptic').checked = appState.settings.haptic !== false;
    document.getElementById('setting-address').value = appState.settings.addressPref || 'jibun';
    document.getElementById('setting-offset').value = appState.settings.offsetPercent || 3;
    
    toggleDarkMode(true);
    updateMainUI();

    // NFC 단축어 자동 실행 로직 — GPS가 실제로 잡힐 때까지 기다렸다가 실행 (최대 8초)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('action') === 'toggle') {
        // 재실행/중복실행 방지를 위해 URL의 쿼리 파라미터를 즉시 제거
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.replaceState({path:newUrl}, '', newUrl);

        showLoading(true, "NFC 인식됨 - GPS 위치 확인 중...");
        const maxWaitMs = 8000;
        const checkIntervalMs = 300;
        let waited = 0;

        const waitForGps = setInterval(() => {
          if (currentLocation) {
            clearInterval(waitForGps);
            showLoading(false);
            toggleDrive();
          } else {
            waited += checkIntervalMs;
            if (waited >= maxWaitMs) {
              clearInterval(waitForGps);
              showLoading(false);
              showAlert('GPS 신호를 받지 못했습니다.\n하늘이 잘 보이는 곳에서 다시 태그하거나, 앱에서 직접 "출발/도착" 버튼을 눌러주세요.');
            }
          }
        }, checkIntervalMs);
    }
  }

  function saveData() {
    localStorage.setItem('driveRecords_v4', JSON.stringify(appState));
    updateMainUI();
  }

  function saveSettings() {
    appState.settings.darkMode = document.getElementById('setting-darkmode').checked;
    appState.settings.haptic = document.getElementById('setting-haptic').checked;
    appState.settings.addressPref = document.getElementById('setting-address').value;
    appState.settings.offsetPercent = parseFloat(document.getElementById('setting-offset').value) || 0;
    saveData();
    renderHistory();
  }

  function toggleDarkMode(init = false) {
    if(!init) saveSettings();
    const isDark = appState.settings.darkMode;
    document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
    const logoImg = document.getElementById('header-logo-img');
    if (logoImg) logoImg.src = isDark ? 'header_logo.png' : 'header_logo_light.png';
  }

  /* GPS 제어 */
  let currentLocation = null;
  navigator.geolocation.watchPosition(
    (pos) => {
      currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const acc = pos.coords.accuracy;
      const dot = document.getElementById('gps-dot');
      const txt = document.getElementById('gps-text');
      dot.className = 'gps-dot ' + (acc < 30 ? 'green' : acc < 100 ? 'yellow' : 'red');
      txt.innerText = acc < 30 ? 'GPS 매우좋음' : acc < 100 ? 'GPS 양호' : 'GPS 약함';
      
      if(!appState.isRunning && document.getElementById('location-text').innerText.includes('파악')) {
        fetchAndDisplayAddress(currentLocation.lat, currentLocation.lng);
      }
    },
    (err) => {
      document.getElementById('gps-dot').className = 'gps-dot red';
      const txt = document.getElementById('gps-text');
      if (err.code === 1) { // PERMISSION_DENIED
        txt.innerText = 'GPS 권한 거부됨';
      } else if (err.code === 2) { // POSITION_UNAVAILABLE
        txt.innerText = 'GPS 신호없음';
      } else { // TIMEOUT 등
        txt.innerText = 'GPS 수신불가';
      }
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
  );

  function triggerHaptic() { if (appState.settings.haptic && navigator.vibrate) navigator.vibrate(50); }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    document.getElementById(`nav-${tabId}`).classList.add('active');
    if(tabId === 'history') renderHistory();
  }

  function showLoading(show, text="처리중...") {
    document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
    document.getElementById('loading-text').innerText = text;
  }

  /* API 호출 로직 (Cloudflare 프록시 서버 경유) */
  async function getAddressesFromCoords(lat, lng) {
    if (!navigator.onLine) return { road: `오프라인(위도:${lat.toFixed(4)})`, jibun: `오프라인(경도:${lng.toFixed(4)})` };
    
    try {
      // 진짜 목표 주소를 프록시 서버에 ?target= 형태로 넘김
      const targetUrl = encodeURIComponent(`https://maps.apigw.ntruss.com/map-reversegeocode/v2/gc?coords=${lng},${lat}&orders=addr,roadaddr&output=json`);
      const response = await fetch(`${PROXY_URL}/?target=${targetUrl}`);

      if (!response.ok) {
        console.warn(`주소 변환 API 실패 (status ${response.status})`);
      }

      const data = await response.json();
      
      let road = "", jibun = "";
      if(data.results && data.results.length > 0) {
        data.results.forEach(res => {
          const name = res.region.area1.name + " " + res.region.area2.name + " " + res.region.area3.name + " ";
          if(res.name === 'roadaddr') road = name + res.land.name + " " + res.land.number1;
          if(res.name === 'addr') jibun = name + res.land.number1 + (res.land.number2 ? "-"+res.land.number2 : "");
        });
      }
      return { road: road.trim(), jibun: jibun.trim() };
    } catch(e) { 
      console.error("주소 변환 프록시 오류:", e);
      return { road: `(API오류) 위도:${lat.toFixed(4)}`, jibun: `(API오류) 경도:${lng.toFixed(4)}` }; 
    }
  }

  async function calculateDistance(startLat, startLng, endLat, endLng) {
    const straightDist = getDistanceFromLatLonInKm(startLat, startLng, endLat, endLng);

    // 이동거리가 너무 짧으면(30m 미만) 출발=도착으로 간주하고 API 호출 자체를 생략
    // (Directions API가 출발/도착이 동일하거나 너무 가까우면 400 에러를 반환하는 문제 예방 + API 사용량 절약)
    const MIN_DISTANCE_KM = 0.03;
    if (straightDist < MIN_DISTANCE_KM) {
      return { distanceKm: straightDist, estimated: false };
    }

    if (!navigator.onLine) return { distanceKm: straightDist * 1.3, estimated: true };

    try {
      const targetUrl = encodeURIComponent(`https://maps.apigw.ntruss.com/map-direction/v1/driving?start=${startLng},${startLat}&goal=${endLng},${endLat}`);
      const response = await fetch(`${PROXY_URL}/?target=${targetUrl}`);

      if (!response.ok) {
        console.warn(`거리 계산 API 실패 (status ${response.status}) - 직선거리로 대체`);
        return { distanceKm: straightDist * 1.3, estimated: true };
      }

      const data = await response.json();
      if(data.route && data.route.traoptimal) {
        return { distanceKm: data.route.traoptimal[0].summary.distance / 1000, estimated: false };
      }
      return { distanceKm: straightDist * 1.3, estimated: true };
    } catch(e) {
      console.error("거리 계산 프록시 오류:", e);
      return { distanceKm: straightDist * 1.3, estimated: true };
    }
  }

  function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1) * (Math.PI/180); const dLon = (lon2-lon1) * (Math.PI/180); 
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c; 
  }

  // 한국시간(KST, UTC+9) 기준 날짜 문자열(YYYY-MM-DD) 반환
  // — 기기의 시간대 설정과 무관하게 항상 한국시간 기준으로 고정 (toISOString()은 UTC라서 새벽 시간대에 날짜가 하루 밀리는 문제가 있었음)
  function getKSTDateString(date = new Date()) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
  }

  async function fetchAndDisplayAddress(lat, lng) {
    const addr = await getAddressesFromCoords(lat, lng);
    const pref = appState.settings.addressPref;
    const resultAddr = pref === 'road' ? (addr.road || addr.jibun) : (addr.jibun || addr.road);
    
    if(!resultAddr || resultAddr.includes('API오류')) {
       document.getElementById('location-text').innerHTML = `<span style="color:#F44336;">주소 변환 API 오류 발생</span><br>(좌표로 대체 기록됩니다)`;
    } else {
       document.getElementById('location-text').innerText = resultAddr;
    }
  }

  /* 운행 로직 */
  async function toggleDrive() {
    triggerHaptic();
    if (!currentLocation) { await showAlert('GPS 위치를 파악하는 중입니다.'); return; }

    showLoading(true, "위치 정보를 처리하고 있습니다...");

    if (!appState.isRunning) {
      const addr = await getAddressesFromCoords(currentLocation.lat, currentLocation.lng);
      appState.currentTrip = { id: Date.now(), startTime: new Date().toISOString(), startLat: currentLocation.lat, startLng: currentLocation.lng, startAddrRoad: addr.road, startAddrJibun: addr.jibun };
      appState.isRunning = true;
      saveData();
    } else {
      const endAddr = await getAddressesFromCoords(currentLocation.lat, currentLocation.lng);
      const trip = appState.currentTrip;
      const distResult = await calculateDistance(trip.startLat, trip.startLng, currentLocation.lat, currentLocation.lng);
      let finalDistance = Math.round((distResult.distanceKm * (1 + (appState.settings.offsetPercent / 100))) * 10) / 10;

      if (!appState.records) appState.records = [];
      appState.records.push({ id: trip.id, date: getKSTDateString(), startTime: trip.startTime, endTime: new Date().toISOString(), startAddrRoad: trip.startAddrRoad, startAddrJibun: trip.startAddrJibun, endAddrRoad: endAddr.road, endAddrJibun: endAddr.jibun, distance: finalDistance, note: distResult.estimated ? "⚠️ 거리 추정치(직선거리 기반)" : "" });
      
      appState.isRunning = false;
      appState.currentTrip = null;
      saveData();

      if (distResult.estimated) {
        document.getElementById('location-text').innerHTML = `<span style="color:#FFB74D;">거리 계산 API 오류 발생</span><br>(직선거리 기반으로 추정 계산되었습니다)`;
      }
    }
    showLoading(false);
  }

  function updateMainUI() {
    const btn = document.getElementById('btn-toggle-drive');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    
    if (appState.isRunning) {
      btn.classList.add('is-running'); btnText.innerText = '도착'; btnIcon.setAttribute('data-lucide', 'square'); lucide.createIcons();
    } else {
      btn.classList.remove('is-running'); btnText.innerText = '출발'; btnIcon.setAttribute('data-lucide', 'play'); lucide.createIcons();
    }

    const today = getKSTDateString();
    const currentMonth = today.substring(0, 7);
    let todayDist = 0, monthDist = 0;

    (appState.records || []).forEach(r => {
      if (r.date === today) todayDist += r.distance;
      if (r.date.startsWith(currentMonth)) monthDist += r.distance;
    });
    document.getElementById('today-distance').innerText = todayDist.toFixed(1);
    document.getElementById('month-distance').innerText = monthDist.toFixed(1);
  }

  /* 타임라인 및 엑셀 다운로드 */
  let expandedDates = new Set();
  let historyViewMode = 'detail';

  function setHistoryViewMode(mode) {
    historyViewMode = mode;
    document.getElementById('btn-view-detail').classList.toggle('active', mode === 'detail');
    document.getElementById('btn-view-summary').classList.toggle('active', mode === 'summary');
    const csvLabel = document.getElementById('csv-mode-label');
    if (csvLabel) csvLabel.innerText = mode === 'summary' ? '요약' : '상세';
    renderHistory();
  }

  function toggleDateGroup(date) {
    if (expandedDates.has(date)) expandedDates.delete(date); else expandedDates.add(date);
    renderHistory();
  }

  // 시/도 축약 매핑 (신규/구 명칭 둘 다 대응)
  const SIDO_ABBR = {
    '서울특별시': '서울', '부산광역시': '부산', '대구광역시': '대구', '인천광역시': '인천',
    '광주광역시': '광주', '대전광역시': '대전', '울산광역시': '울산', '세종특별자치시': '세종',
    '경기도': '경기',
    '강원특별자치도': '강원', '강원도': '강원',
    '충청북도': '충북', '충청남도': '충남',
    '전북특별자치도': '전북', '전라북도': '전북', '전라남도': '전남',
    '경상북도': '경북', '경상남도': '경남',
    '제주특별자치도': '제주', '제주도': '제주'
  };

  // 주소 문자열에서 지역명(시/군/구)만 추출 — 요약보기 그룹 병합 판단 전용 (표시용 아님)
  function extractRegion(addr) {
    if (!addr || addr.includes('API오류') || addr.includes('주소 정보 없음')) return null;
    const parts = addr.trim().split(/\s+/);
    return parts.length >= 2 ? parts[1] : (parts[0] || null);
  }

  // 상세보기용 — 시/도만 축약하고 나머지(시/군/구~번지)는 전부 그대로 표기
  function formatFullAddress(addr) {
    if (!addr || addr.includes('API오류') || addr.includes('주소 정보 없음')) return addr;
    const parts = addr.trim().split(/\s+/);
    if (parts.length > 0) parts[0] = SIDO_ABBR[parts[0]] || parts[0];
    return parts.join(' ');
  }

  // 일지용 요약보기용 — 시/도(축약) + 시/군/구까지만 (세종은 시/군/구 단계가 없어 '세종'만 표기)
  function formatRegionAddress(addr) {
    if (!addr || addr.includes('API오류') || addr.includes('주소 정보 없음')) return addr;
    const parts = addr.trim().split(/\s+/);
    const sido = SIDO_ABBR[parts[0]] || parts[0];
    if (sido === '세종') return '세종';
    return parts.length >= 2 ? `${sido} ${parts[1]}` : sido;
  }

  // 도착지 지역이 바뀔 때까지 연속된 구간을 하나로 합산 (일지용 요약 보기 전용)
  // records는 반드시 시간순(오름차순)으로 전달해야 함
  function buildSummaryGroups(records) {
    const groups = [];
    records.forEach(r => {
      const sAddr = appState.settings.addressPref === 'road' ? (r.startAddrRoad || r.startAddrJibun) : (r.startAddrJibun || r.startAddrRoad);
      const eAddr = appState.settings.addressPref === 'road' ? (r.endAddrRoad || r.endAddrJibun) : (r.endAddrJibun || r.endAddrRoad);
      const destRegionKey = extractRegion(eAddr); // 병합 판단 전용 키

      const last = groups[groups.length - 1];
      if (last && destRegionKey && last._destRegionKey === destRegionKey) {
        last.distance += r.distance;
        last.destAddrRaw = eAddr || last.destAddrRaw; // 표시용 원본 주소는 최신 도착지로 갱신
      } else {
        groups.push({
          startAddr: sAddr || '(주소 정보 없음)',
          destAddrRaw: eAddr || '(주소 정보 없음)',
          _destRegionKey: destRegionKey,
          distance: r.distance
        });
      }
    });
    return groups;
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    if(!appState.records || appState.records.length === 0) { list.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:50px;">운행 기록이 없습니다.</div>'; return; }

    const grouped = appState.records.reduce((acc, obj) => { if (!acc[obj.date]) acc[obj.date] = []; acc[obj.date].push(obj); return acc; }, {});
    const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

    // 최초 렌더링 시 가장 최근 날짜만 기본으로 펼쳐둠
    if (expandedDates.size === 0 && sortedDates.length > 0) {
      expandedDates.add(sortedDates[0]);
    }

    let html = '';
    sortedDates.forEach(date => {
      const chronological = grouped[date]; // 원본 순서 = 시간순(오름차순)
      const dailyTotal = chronological.reduce((sum, r) => sum + r.distance, 0).toFixed(1);
      const isExpanded = expandedDates.has(date);

      html += `<div class="card-date ${isExpanded ? '' : 'collapsed'}" onclick="toggleDateGroup('${date}')">
        <span>${date}</span>
        <span class="card-date-right">
          <span class="card-date-total">${dailyTotal} km</span>
          <i data-lucide="chevron-down" class="date-chevron"></i>
        </span>
      </div>`;

      html += `<div class="date-group-body" style="display:${isExpanded ? 'block' : 'none'};">`;

      if (historyViewMode === 'summary') {
        buildSummaryGroups(chronological).slice().reverse().forEach(g => {
          html += `<div class="summary-card">
            <div class="summary-route">${formatRegionAddress(g.startAddr)} → ${formatRegionAddress(g.destAddrRaw)}</div>
            <span class="summary-distance">${g.distance.toFixed(1)} km</span>
          </div>`;
        });
      } else {
        chronological.slice().reverse().forEach(r => {
          let sAddr = appState.settings.addressPref === 'road' ? (r.startAddrRoad || r.startAddrJibun) : (r.startAddrJibun || r.startAddrRoad);
          let eAddr = appState.settings.addressPref === 'road' ? (r.endAddrRoad || r.endAddrJibun) : (r.endAddrJibun || r.endAddrRoad);

          if(!sAddr || sAddr.includes('API오류')) sAddr = '(주소 정보 없음)';
          if(!eAddr || eAddr.includes('API오류')) eAddr = '(주소 정보 없음)';

          let sTime = new Date(r.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', timeZone: 'Asia/Seoul'});
          let eTime = r.endTime ? new Date(r.endTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', timeZone: 'Asia/Seoul'}) : '진행중';

          html += `<div class="swipe-wrapper" data-id="${r.id}">
            <div class="swipe-delete-bg" onclick="deleteRecord(${r.id})"><i data-lucide="trash-2" style="width:18px; height:18px;"></i></div>
            <div class="timeline-card" data-id="${r.id}">
              <div class="card-row-top">
                <span class="card-time">${sTime} ~ ${eTime}</span>
                <span class="card-distance">${r.distance.toFixed(1)} km</span>
              </div>
              <div class="card-addr-row"><span class="card-addr-label">출발</span>${formatFullAddress(sAddr)}</div>
              <div class="card-addr-row"><span class="card-addr-label">도착</span>${formatFullAddress(eAddr)}</div>
              ${r.note ? `<div class="card-note-badge">${r.note}</div>` : ''}
            </div>
          </div>`;
        });
      }

      html += `</div>`;
    });

    list.innerHTML = html;
    lucide.createIcons();
    attachSwipeHandlers();
  }

  /* 카드 스와이프(좌측으로 밀어 삭제) 처리 */
  const SWIPE_OPEN_PX = 64;
  function attachSwipeHandlers() {
    document.querySelectorAll('.timeline-card').forEach(card => {
      let startX = 0, currentX = 0, dragging = false, moved = false;

      const onStart = (x) => { startX = x; dragging = true; moved = false; card.style.transition = 'none'; };
      const onMove = (x) => {
        if (!dragging) return;
        let delta = x - startX;
        // 왼쪽으로만 밀리게 제한 (오른쪽으로는 안 열림), 최대 SWIPE_OPEN_PX 만큼만
        delta = Math.min(0, Math.max(delta, -SWIPE_OPEN_PX));
        if (Math.abs(delta) > 5) moved = true;
        currentX = delta;
        card.style.transform = `translateX(${currentX}px)`;
      };
      const onEnd = () => {
        if (!dragging) return;
        dragging = false;
        card.style.transition = 'transform 0.25s ease';
        // 절반 이상 밀렸으면 완전히 열어서 고정, 아니면 원위치
        if (currentX < -SWIPE_OPEN_PX / 2) {
          card.style.transform = `translateX(-${SWIPE_OPEN_PX}px)`;
        } else {
          card.style.transform = 'translateX(0)';
        }
      };

      card.addEventListener('touchstart', e => onStart(e.touches[0].clientX), { passive: true });
      card.addEventListener('touchmove', e => onMove(e.touches[0].clientX), { passive: true });
      card.addEventListener('touchend', onEnd);

      // 데스크톱 테스트용 마우스 지원
      card.addEventListener('mousedown', e => onStart(e.clientX));
      card.addEventListener('mousemove', e => { if (dragging) onMove(e.clientX); });
      card.addEventListener('mouseup', onEnd);
      card.addEventListener('mouseleave', () => { if (dragging) onEnd(); });

      // 스와이프(드래그)가 아니었을 때만 편집 모달 열기
      card.addEventListener('click', () => {
        if (moved) { moved = false; return; }
        editRecord(parseInt(card.dataset.id));
      });
    });
  }

  async function deleteRecord(id) {
    const ok = await showConfirm('이 운행 기록을 삭제하시겠습니까?');
    if (!ok) {
      // 취소 시 카드 원위치
      const card = document.querySelector(`.timeline-card[data-id="${id}"]`);
      if (card) card.style.transform = 'translateX(0)';
      return;
    }
    appState.records = appState.records.filter(r => r.id !== id);
    saveData();
    renderHistory();
  }

  function openAddModal() {
    document.getElementById('add-date').value = getKSTDateString();
    const now = new Date();
    const kstNow = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
    document.getElementById('add-start-time').value = kstNow;
    document.getElementById('add-end-time').value = kstNow;
    document.getElementById('add-start-addr').value = '';
    document.getElementById('add-end-addr').value = '';
    document.getElementById('add-distance').value = '';
    document.getElementById('add-note').value = '';
    document.getElementById('add-modal').classList.add('active');
  }

  function closeAddModal() {
    document.getElementById('add-modal').classList.remove('active');
  }

  async function saveAddModal() {
    const dateVal = document.getElementById('add-date').value;
    const startTimeVal = document.getElementById('add-start-time').value;
    const endTimeVal = document.getElementById('add-end-time').value;
    const startAddr = document.getElementById('add-start-addr').value.trim();
    const endAddr = document.getElementById('add-end-addr').value.trim();
    const distanceVal = parseFloat(document.getElementById('add-distance').value);

    if (!dateVal || !startTimeVal || !endTimeVal || isNaN(distanceVal)) {
      await showAlert('날짜, 출발/도착 시간, 거리는 필수 입력입니다.');
      return;
    }

    // 입력값을 한국시간(KST, UTC+9) 기준으로 명시적으로 해석 — 기기 시간대 설정과 무관하게 항상 정확하도록
    const startTimeISO = new Date(`${dateVal}T${startTimeVal}:00+09:00`).toISOString();
    const endTimeISO = new Date(`${dateVal}T${endTimeVal}:00+09:00`).toISOString();

    if (!appState.records) appState.records = [];
    appState.records.push({
      id: Date.now(),
      date: dateVal,
      startTime: startTimeISO,
      endTime: endTimeISO,
      startAddrRoad: startAddr, startAddrJibun: startAddr,
      endAddrRoad: endAddr, endAddrJibun: endAddr,
      distance: distanceVal,
      note: document.getElementById('add-note').value.trim() || '✏️ 수동 입력'
    });

    saveData();
    expandedDates.add(dateVal); // 방금 추가한 날짜는 펼쳐서 바로 보이게
    renderHistory();
    updateMainUI();
    closeAddModal();
  }

  let editingRecordId = null;

  function editRecord(id) {
    const r = appState.records.find(x => x.id === id);
    if(!r) return;
    editingRecordId = id;
    document.getElementById('edit-distance').value = r.distance;
    document.getElementById('edit-note').value = r.note || '';
    document.getElementById('edit-modal').classList.add('active');
  }

  function closeEditModal() {
    document.getElementById('edit-modal').classList.remove('active');
    editingRecordId = null;
  }

  function saveEditModal() {
    const r = appState.records.find(x => x.id === editingRecordId);
    if(!r) return closeEditModal();

    const newDist = parseFloat(document.getElementById('edit-distance').value);
    if(!isNaN(newDist)) r.distance = newDist;
    r.note = document.getElementById('edit-note').value;

    saveData();
    renderHistory();
    closeEditModal();
  }

  function buildCSVBlob() {
    const escape = str => `"${String(str || '').replace(/"/g, '""')}"`;

    const grouped = appState.records.reduce((acc, obj) => { if (!acc[obj.date]) acc[obj.date] = []; acc[obj.date].push(obj); return acc; }, {});
    const sortedDates = Object.keys(grouped).sort((a, b) => new Date(a) - new Date(b)); // 오래된 날짜부터

    let csvContent;

    if (historyViewMode === 'summary') {
      // 화면의 "일지용 요약" 보기와 동일하게 지역 합산해서 출력
      csvContent = "\uFEFF일자,출발지,도착지,주행거리(km)\n";
      sortedDates.forEach(date => {
        const groups = buildSummaryGroups(grouped[date]);
        let dailySum = 0;
        groups.forEach(g => {
          dailySum += g.distance;
          csvContent += `${date},${escape(formatRegionAddress(g.startAddr))},${escape(formatRegionAddress(g.destAddrRaw))},${g.distance.toFixed(1)}\n`;
        });
        csvContent += `${date} 총합,,,${dailySum.toFixed(1)}\n`;
      });
    } else {
      // 기존 상세보기 형식 그대로
      csvContent = "\uFEFF일자,출발시간,도착시간,출발지,도착지,주행거리(km),비고\n";
      sortedDates.forEach(date => {
        const records = [...grouped[date]].sort((a,b) => new Date(a.startTime) - new Date(b.startTime));
        let dailySum = 0;
        records.forEach(r => {
          dailySum += r.distance;
          let sAddr = appState.settings.addressPref === 'road' ? (r.startAddrRoad || r.startAddrJibun) : (r.startAddrJibun || r.startAddrRoad);
          let eAddr = appState.settings.addressPref === 'road' ? (r.endAddrRoad || r.endAddrJibun) : (r.endAddrJibun || r.endAddrRoad);
          csvContent += `${r.date},${new Date(r.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', timeZone: 'Asia/Seoul'})},${r.endTime ? new Date(r.endTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', timeZone: 'Asia/Seoul'}) : ''},${escape(sAddr)},${escape(eAddr)},${r.distance.toFixed(1)},${escape(r.note)}\n`;
        });
        csvContent += `${date} 총합,,,,,${dailySum.toFixed(1)}\n`;
      });
    }

    const modeLabel = historyViewMode === 'summary' ? '요약' : '상세';
    const filename = `운행기록_${modeLabel}_${getKSTDateString()}.csv`;
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    return { blob, filename };
  }

  async function downloadCSV() {
    if(!appState.records || appState.records.length === 0) { await showAlert('데이터가 없습니다.'); return; }

    const modeLabel = historyViewMode === 'summary' ? '일지용 요약' : '상세';
    const ok = await showConfirm(`"${modeLabel}" 보기 기준으로 CSV 파일을 다운로드하시겠습니까?`);
    if (!ok) return;

    const { blob, filename } = buildCSVBlob();

    // data URI 대신 Blob 방식 사용 — iOS 홈 화면(standalone) PWA에서 data URI 다운로드가
    // 씹히거나 새 탭에 텍스트로만 열리는 문제가 있어서, 호환성이 더 나은 Blob+ObjectURL로 변경
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function toggleAdvancedSettings() {
    const body = document.getElementById('advanced-settings-body');
    const toggle = document.getElementById('advanced-toggle');
    const isOpen = body.style.display === 'block';
    body.style.display = isOpen ? 'none' : 'block';
    toggle.classList.toggle('open', !isOpen);
  }

  async function deletePastMonths() {
    if (!appState.records || appState.records.length === 0) { await showAlert('삭제할 데이터가 없습니다.'); return; }

    const currentMonth = getKSTDateString().slice(0, 7); // 예: "2026-08"
    const toDelete = appState.records.filter(r => r.date.slice(0, 7) !== currentMonth);
    const toKeep = appState.records.filter(r => r.date.slice(0, 7) === currentMonth);

    if (toDelete.length === 0) { await showAlert('이번 달 이전 기록이 없습니다.'); return; }

    const totalKm = toDelete.reduce((sum, r) => sum + r.distance, 0).toFixed(1);
    const ok = await showConfirm(`이번 달 이전 기록 ${toDelete.length}건 (총 ${totalKm}km)이 삭제됩니다.\n백업하지 않았다면 먼저 백업을 권장합니다.\n계속하시겠습니까?`);
    if (!ok) return;

    appState.records = toKeep;
    saveData();
    renderHistory();
    updateMainUI();
  }

  async function resetData() {
    const ok = await showConfirm('정말로 모든 데이터를 삭제하시겠습니까? (복구 불가능)');
    if (ok) { localStorage.removeItem('driveRecords_v4'); window.location.reload(); }
  }

  async function exportBackup() {
    const jsonContent = JSON.stringify(appState, null, 2);
    const fixedFilename = '운행기록_백업.json'; // 날짜 안 붙임 — 매번 같은 이름으로 저장되게

    // 지원되는 브라우저(주로 PC 크롬 계열)는 저장 위치를 직접 골라 진짜 덮어쓰기 가능
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: fixedFilename,
          types: [{ description: 'JSON 백업 파일', accept: { 'application/json': ['.json'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(jsonContent);
        await writable.close();
        return;
      } catch (e) {
        if (e.name === 'AbortError') return; // 사용자가 저장 취소
        console.warn('파일 저장 API 실패, 일반 다운로드로 대체:', e);
      }
    }

    // 미지원 환경(대부분 모바일) → 고정 파일명으로 일반 다운로드
    const blob = new Blob([jsonContent], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fixedFilename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function handleRestoreFile(event) {
    const file = event.target.files[0];
    event.target.value = ''; // 같은 파일을 다시 선택할 수 있도록 초기화
    if (!file) return;

    try {
      const text = await file.text();
      const parsed = JSON.parse(text);

      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.records)) {
        await showAlert('올바른 백업 파일이 아닙니다.');
        return;
      }

      const currentCount = (appState.records || []).length;
      const ok = await showConfirm(`백업 파일을 불러오면 현재 데이터(${currentCount}건)는 사라지고\n백업 데이터(${parsed.records.length}건)로 교체됩니다.\n계속하시겠습니까?`);
      if (!ok) return;

      localStorage.setItem('driveRecords_v4', JSON.stringify(parsed));
      window.location.reload();
    } catch (e) {
      console.error('백업 복원 오류:', e);
      await showAlert('파일을 읽는 중 오류가 발생했습니다.\n올바른 JSON 백업 파일인지 확인해주세요.');
    }
  }

  async function forceRefreshApp() {
    showLoading(true, "앱을 새로고침하는 중...");
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch(e) {
      console.error('새로고침 처리 중 오류:', e);
    }
    window.location.reload();
  }

  window.onload = loadData;
</script>
